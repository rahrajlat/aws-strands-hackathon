name: act-or-escalate
title: Act-or-Escalate (small model, or escalate to a frontier model)
pattern: model-routing            # submission tag: #model-routing
decision_type: yes_no             # Decider 2B "noul" question, answered with P(yes)
question:
  key: needs_frontier
  text: >-
    Does answering this request need a frontier model? Say yes if it needs multi-step reasoning,
    careful planning, long or nuanced writing, specialist knowledge, or handling an upset customer;
    say no if it is a short factual lookup, a simple instruction, or small talk.
  options:
    "yes": needs deep reasoning, planning, nuance or specialist knowledge
    "no": a short, simple, well-defined request a small model answers correctly
policy:
  act_on_small_when: answer is "no" AND confidence >= threshold
  escalate_when: answer is "yes", OR confidence < threshold, OR Decider is unreachable
  default_threshold: 0.70
wiring:
  strands_api: strands.models.ModelRouter + a custom RoutingStrategy
  file: handler.py
  class: DeciderRoutingStrategy
  replaces: strands.models.routing.ClassifierStrategy (which asks an LLM to route every request)
requires:
  - strands-agents
  - a running Decider 2B server (strands-decider serve <checkpoint> --port 8099)
measured:
  hardware: laptop RTX 3050 6 GB under WSL2, checkpoint StrandsAgents/strands-decider-2B-hobson-v19
  set: 40 hand-labelled customer-support requests (20 simple, 20 hard)
  routing_correct: 36/40
  simple_needlessly_escalated: 0/20
  hard_escalated: 16/20
  hard_left_on_small_model: 4/20
  median_decision_latency_ms: 123
