# Stale order check — is an order from Earth still valid given the current rover state?
#
# Pattern: guardrails
# Before executing any Earth order, ask whether the state it assumes still holds.
# If confidence that the order is still valid falls below the threshold, block it.
#
# Measured on Strands Decider 2B:
#   stale_blocked: 9/12
#   valid_wrongly_blocked: 0/12
#   median_check_latency_ms: 110
#
# Use via YamlInterventionHandler.from_yaml() for automatic Strands wiring.

name: stale-order-check
description: >-
  Verify that an order from Earth is still safe and appropriate before executing it.
  Blocks orders that assumed a state that has since changed.
pattern: guardrails

questions:
  - key: order_valid
    type: yesno
    text: >-
      Is the thing this tool call acts on still in the state the call expects?
    short: Order still valid?
    yes: still in the expected state, so the call is still appropriate
    no: >-
      already done, cancelled, closed, expired, refunded, paid or unavailable;
      the call would act on something that no longer needs acting on

policy:
  threshold: 0.50

  rules:
    - name: proceed with valid order
      when: {order_valid: yes}
      then: proceed

  default: deny
