[project]
name = "roverthinking"
version = "0.1.0"
description = "Earth is too far. The rover decides. A Textual game where a Strands Decider 2B-powered rover makes its own calls on Mars."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "textual>=0.80",
    "strands-agents[ollama]>=1.61",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "boto3>=1.43.114",
]

[project.optional-dependencies]
# Local Decider 2B server (heavy: pulls torch). Run under Linux/WSL2.
decider = ["strands-decider"]
bench = ["matplotlib>=3.8"]

[project.scripts]
roverthinking = "roverthinking.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roverthinking", "src/decider_framework"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"recipes/**" = ["E501", "I001"]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
